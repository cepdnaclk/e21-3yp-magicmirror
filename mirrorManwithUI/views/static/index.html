<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflect Studio | Smart Mirror</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <!-- Welcome Screen: appears once when the mirror system starts -->
    <div id="welcome-screen">
        <div class="welcome-content">
            <div class="welcome-heart">♡</div>
            <h1>Reflect Studio</h1>
            <p>Good to see you</p>
        </div>
    </div>

    <div id="mirror-wrapper">
        <div id="ui-layer">

            <div class="widget top-left combined-left-container">
                <div class="glass-card" id="time-container">
                    <div class="cyan-glow-text greeting-title">
                        Good Day <span class="heart-icon">♡</span>
                    </div>

                    <h1 id="clock">00:00:00</h1>
                    <p id="date">Initializing...</p>
                    <p id="gentle-message">Have a lovely day</p>
                </div>

                <div class="glass-card calendar-widget">
                    <div class="cyan-glow-text" id="month-name">Month View</div>
                    <div id="calendar-grid"></div>
                </div>
            </div>

            <div class="widget top-right glass-card">
                <div class="cyan-glow-text">Weather</div>

                <div id="weather-box">
                    <h2 id="temp">--°C</h2>
                    <p id="desc" class="status-text">Fetching weather...</p>
                    <p id="hum">Humidity: --%</p>

                    <div id="weather-suggestion">
                        Weather suggestion...
                    </div>
                </div>
            </div>

            <div class="widget bottom-right glass-card">
                <h3 class="cyan-glow-text">Today</h3>
                <ul id="calendar-list"></ul>
            </div>

        </div>

        <div id="big-popup" class="glass-card">
            <div class="cyan-glow-text">Message</div>
            <div id="popup-text"></div>
        </div>

        <div id="video-layer">
            <video id="mirror-video" loop muted playsinline>
                <source src="static/idle.mp4" type="video/mp4">
            </video>
        </div>

        <div class="widget bottom-center glass-card" id="notification-container">
            <div class="cyan-glow-text">Messages</div>
            <div id="notification-content">
                <p class="status-text">No new messages</p>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();

            document.getElementById('clock').innerText =
                now.toLocaleTimeString('en-US', { hour12: false });

            document.getElementById('date').innerText =
                now.toLocaleDateString('en-US', {
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric',
                    year: 'numeric'
                });
        }

        setInterval(updateTime, 1000);
        updateTime();

        const socket = new WebSocket('ws://' + window.location.host + '/ws');

        function addScheduleItem(item) {
            const list = document.getElementById('calendar-list');

            const time        = item.time        || '--:--';
            const name        = item.reason      || item.name || 'Untitled';
            const date        = item.date        || 'Today';
            const expiryEpoch = item.expiry_epoch || '';
            const itemId      = item.id ? `reminder-${item.id}` : `reminder-${Date.now()}`;

            const li = document.createElement('li');
            li.id   = itemId;
            if (expiryEpoch) li.dataset.expiry = expiryEpoch;
            li.innerHTML = `<span class="time-tag">${time}</span> ${name}
                            <span class="schedule-meta">${date}</span>`;
            list.appendChild(li);
        }

        // Rebuild the entire reminder/schedule box from a live DynamoDB list
        function syncReminderList(items) {
            const list = document.getElementById('calendar-list');
            list.innerHTML = '';
            if (!items || items.length === 0) {
                list.innerHTML = '<li style="color:var(--muted-white);font-size:15px;">No upcoming reminders</li>';
                return;
            }
            items.forEach(item => addScheduleItem(item));
        }

        // Every 60 s: remove any list items whose scheduled time has passed
        setInterval(() => {
            const now = Date.now();
            document.querySelectorAll('#calendar-list li[data-expiry]').forEach(li => {
                const expiry = parseInt(li.dataset.expiry, 10);
                if (expiry && now > expiry) {
                    li.style.transition = 'opacity 0.6s ease';
                    li.style.opacity   = '0';
                    setTimeout(() => {
                        li.remove();
                        const list = document.getElementById('calendar-list');
                        if (list && list.children.length === 0) {
                            list.innerHTML = '<li style="color:var(--muted-white);font-size:15px;">No upcoming reminders</li>';
                        }
                    }, 650);
                }
            });
        }, 60000);

        let mirrorActive = false;
        let userIsPresent = false;
        let activeMessage = null;
        let activeMsgState = null; // 'FULLSCREEN' or 'NOTIFICATION_BOX'
        let activeMsgTimer = null;
        let userHasBeenPresentWithBoxMsg = false;

        function clearActiveMsgTimer() {
            if (activeMsgTimer) {
                clearTimeout(activeMsgTimer);
                activeMsgTimer = null;
            }
        }

        function displayFullscreen(text, durationSeconds) {
            const popup = document.getElementById('big-popup');
            const wrapper = document.getElementById('mirror-wrapper');
            
            // Remove blackout so the fullscreen popup is visible
            wrapper.classList.remove('black-out');
            
            popup.innerHTML = `
                <div class="cyan-glow-text">Message</div>
                <div id="popup-text">${text}</div>
                <div class="progress-container">
                    <div class="progress-bar" style="animation: shrink ${durationSeconds}s linear forwards;"></div>
                </div>
            `;
            popup.classList.add('show');
        }

        function hideFullscreen() {
            const popup = document.getElementById('big-popup');
            popup.classList.remove('show');
        }

        function showNotificationInBox(text) {
            const notifyBox = document.getElementById('notification-content');
            const timestamp = new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            if (notifyBox.innerText.includes("No new messages")) {
                notifyBox.innerHTML = "";
            }
            
            notifyBox.innerHTML = ""; // Show only the current message
            
            const newEntry = document.createElement('div');
            newEntry.className = 'history-item';
            newEntry.id = 'active-box-msg';
            newEntry.innerHTML = `<span style="color:var(--gold)">[${timestamp}]</span> ${text}`;
            notifyBox.appendChild(newEntry);
        }

        function clearNotificationBox() {
            const notifyBox = document.getElementById('notification-content');
            notifyBox.innerHTML = '<p class="status-text">No new messages</p>';
        }

        function updateBlackoutState() {
            const wrapper = document.getElementById('mirror-wrapper');
            const v = document.getElementById('mirror-video');
            if (userIsPresent) {
                wrapper.classList.remove('black-out');
            } else {
                if (activeMsgState === 'FULLSCREEN') {
                    wrapper.classList.remove('black-out');
                } else {
                    wrapper.classList.add('black-out');
                    v.pause();
                }
            }
        }

        socket.onmessage = (event) => {
            const v = document.getElementById('mirror-video');
            const wrapper = document.getElementById('mirror-wrapper');
            const uiLayer = document.getElementById('ui-layer');
            const videoLayer = document.getElementById('video-layer');
            const notifyBox = document.getElementById('notification-content');
            const popup = document.getElementById('big-popup');

            let payload = null;

            try {
                payload = JSON.parse(event.data);
            } catch {
                payload = event.data;
            }

            if (typeof payload === 'string') {
                if (payload === 'show_mirror') {
                    mirrorActive = true;

                    uiLayer.classList.add('hidden');
                    videoLayer.classList.add('visible');

                    if (!v.src.includes('idle.mp4')) {
                        v.src = 'static/idle.mp4';
                    }

                    v.play();
                    return;
                }

                if (payload === 'hide_mirror') {
                    mirrorActive = false;

                    videoLayer.classList.remove('visible');
                    uiLayer.classList.remove('hidden');

                    v.pause();
                    return;
                }

                if (payload === 'idle') {
                    if (mirrorActive) {
                        if (!v.src.includes('idle.mp4')) {
                            v.src = 'static/idle.mp4';
                        }

                        v.play();
                    }

                    return;
                }

                if (payload === 'thinking') {
                    if (!v.src.includes('thinking.mp4')) {
                        v.src = 'static/thinking.mp4';
                        v.play();
                    }

                    return;
                }

                if (payload === 'talking') {
                    if (!v.src.includes('talking.mp4')) {
                        v.src = 'static/talking.mp4';
                        v.play();
                    }

                    return;
                }

                return;
            }

            if (payload && payload.type === 'presence') {
                const isPresent = payload.value === 'present';
                userIsPresent = isPresent;

                if (isPresent) {
                    if (activeMessage && activeMsgState === 'FULLSCREEN') {
                        // Reset timer to 10 seconds since they just appeared
                        clearActiveMsgTimer();
                        displayFullscreen(activeMessage, 10);
                        activeMsgTimer = setTimeout(() => {
                            hideFullscreen();
                            activeMessage = null;
                            activeMsgState = null;
                            updateBlackoutState();
                        }, 10000);
                    } else if (activeMessage && activeMsgState === 'NOTIFICATION_BOX') {
                        userHasBeenPresentWithBoxMsg = true;
                    }
                } else {
                    if (activeMessage && activeMsgState === 'NOTIFICATION_BOX' && userHasBeenPresentWithBoxMsg) {
                        clearNotificationBox();
                        activeMessage = null;
                        activeMsgState = null;
                        userHasBeenPresentWithBoxMsg = false;
                    }
                }

                updateBlackoutState();
                return;
            }

            if (payload && payload.type === 'notification') {
                const rawMsg = payload.message;

                clearActiveMsgTimer();
                hideFullscreen();
                clearNotificationBox();

                activeMessage = rawMsg;
                activeMsgState = 'FULLSCREEN';
                userHasBeenPresentWithBoxMsg = false;

                if (userIsPresent) {
                    displayFullscreen(rawMsg, 10);
                    activeMsgTimer = setTimeout(() => {
                        hideFullscreen();
                        activeMessage = null;
                        activeMsgState = null;
                        updateBlackoutState();
                    }, 10000);
                } else {
                    displayFullscreen(rawMsg, 1800); // 30 minutes
                    activeMsgTimer = setTimeout(() => {
                        hideFullscreen();
                        activeMsgState = 'NOTIFICATION_BOX';
                        showNotificationInBox(rawMsg);
                        updateBlackoutState();
                    }, 1800000); // 30 minutes
                }

                updateBlackoutState();
                return;
            }

            if (payload && payload.type === 'reminder') {
                const rawMsg = payload.message;

                displayFullscreen(rawMsg, 10);
                setTimeout(() => {
                    hideFullscreen();

                    try {
                        let namePart = "Untitled";
                        let datePart = "Today";
                        let timePart = "Now";

                        if (rawMsg.includes("👉")) {
                            let parts = rawMsg.split("👉");

                            namePart = parts[1] ? parts[1].trim() : "Untitled";

                            let dateTimePart =
                                parts[0].replace(/📅 |Upcoming: /gi, "").trim();

                            let dateTimeSplit = dateTimePart.split(/ at /i);

                            datePart = dateTimeSplit[0]
                                ? dateTimeSplit[0].trim()
                                : "Today";

                            timePart = dateTimeSplit[1]
                                ? dateTimeSplit[1].trim()
                                : "Now";
                        } else {
                            namePart = rawMsg;
                        }

                        addScheduleItem({
                            time: timePart,
                            name: namePart,
                            date: datePart
                        });
                    } catch (e) {
                        addScheduleItem({
                            time: 'Now',
                            name: rawMsg,
                            date: 'Today'
                        });
                    }
                }, 10000);

            }

            // ── DynamoDB live reminder list ─────────────────────────────
            if (payload && payload.type === 'reminder_list') {
                syncReminderList(payload.items);
                return;
            }
        };

        async function updateMirrorData() {
            try {
                const response = await fetch('/api/weather');
                const result = await response.json();

                if (result.status !== "success") {
                    console.log("Weather unavailable. Keeping previous weather on screen.");
                    return;
                }

                const weather = result.data;

                document.getElementById('temp').innerText =
                    `${weather.temperature}°C`;

                document.getElementById('hum').innerText =
                    `Humidity: ${weather.humidity}%`;

                document.getElementById('desc').innerText =
                    weather.condition;

                if (weather.suggestions && weather.suggestions.length > 0) {
                    document.getElementById('weather-suggestion').innerText =
                        weather.suggestions[0].message;
                }

            } catch (e) {
                console.log("Weather fetch error. Keeping previous weather on screen:", e);
            }
        }

        function buildCalendar() {
            const now = new Date();

            const month = now.getMonth();
            const year = now.getFullYear();

            const monthNames = [
                "January", "February", "March", "April",
                "May", "June", "July", "August",
                "September", "October", "November", "December"
            ];

            document.getElementById('month-name').innerText =
                `${monthNames[month]} ${year}`;

            const grid = document.getElementById('calendar-grid');

            grid.innerHTML = '';

            const dayHeaders = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.innerText = day;
                header.classList.add('grid-header');
                grid.appendChild(header);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const div = document.createElement('div');

                div.innerText = d;
                div.classList.add('calendar-day');

                if (d === now.getDate()) {
                    div.classList.add('today');
                }

                grid.appendChild(div);
            }
        }

        buildCalendar();
        updateMirrorData();
        setInterval(updateMirrorData, 600000);

        window.addEventListener("load", () => {
            const welcomeScreen = document.getElementById("welcome-screen");

            setTimeout(() => {
                if (welcomeScreen) {
                    welcomeScreen.classList.add("hide-welcome");
                }
            }, 4000);
        });
    </script>
</body>

</html>
